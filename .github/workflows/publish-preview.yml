name: Publish isolated Driver preview
# refresh-independent-sheet

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview host
        uses: actions/checkout@v4

      - name: Recover current public browser map key
        run: |
          python3 - <<'PY' > /tmp/maps_key
          import re
          from pathlib import Path
          text = Path("index.html").read_text()
          match = re.search(r'maps\.googleapis\.com/maps/api/js\?key=([^"&]+)', text)
          if not match:
              raise SystemExit("Current preview does not contain the browser Maps key")
          print(match.group(1))
          PY

      - name: Checkout latest PR 92 branch
        uses: actions/checkout@v4
        with:
          repository: baccarisverige-ux/Movera-drider-
          ref: feat/live-map-color-lab
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Configure Google Maps
        working-directory: app
        run: |
          MAPS_KEY="$(cat /tmp/maps_key)"
          sed -i "s|GOOGLE_MAPS_API_KEY|$MAPS_KEY|g" web/index.html

      - name: Build latest real Driver preview
        working-directory: app
        run: flutter build web --release --base-href "/baccarisverige-ux/driver-movera-1/main/"

      - name: Install compiled preview
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md ! -name app -exec rm -rf {} +
          cp -R app/build/web/. .
          rm -rf app

      - name: Commit compiled preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: refresh PR 92 map color lab build" || exit 0
          git push
