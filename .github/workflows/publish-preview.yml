name: Publish isolated Driver preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-preview.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview host
        uses: actions/checkout@v4

      - name: Download compiled PR 92 preview
        run: |
          curl -fL "https://nightly.link/baccarisverige-ux/Movera-drider-/actions/artifacts/11195808680.zip" -o /tmp/preview.zip
          mkdir -p /tmp/preview
          unzip -q /tmp/preview.zip -d /tmp/preview

      - name: Install compiled preview
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name README.md -exec rm -rf {} +
          cp -R /tmp/preview/. .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          s = s.replace('<base href="/driver-movera-1/">', '<base href="/baccarisverige-ux/driver-movera-1/main/">')
          p.write_text(s)
          PY

      - name: Commit compiled preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: publish PR 92 map color lab build" || exit 0
          git push
